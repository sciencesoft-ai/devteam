# DevTeam distribution settings. Sourced by scripts/*.sh and CI.
# Keep values plain: KEY="value", no command substitution.

# --- Upstream ---------------------------------------------------------------
# Where the pinned source is fetched from (our fork), and the canonical
# upstream used when the fork does not yet carry the pinned tag.
UPSTREAM_REPO="https://github.com/sciencesoft-ai/KiroCrew.git"
UPSTREAM_CANONICAL="https://github.com/kirodotdev/kirocrew.git"
# Pinned upstream release (stable tags only). Bumped by upstream-sync.yml.
UPSTREAM_REF="v0.12.2"

# --- Distribution identity ---------------------------------------------------
DEVTEAM_RELEASE="1"                       # -> version label v0.12.2+devteam.1
PRODUCT_NAME="DevTeam"
APP_ID="com.sciencesoft.devteam"

# --- Side-by-side install (scripts/distribution.py) --------------------------
# Everything DevTeam publishes outside its own install is named here, so it can
# be installed next to stock Kiro Crew without either touching the other.
# Upstream values are in parentheses.
CLI_NAME="devteam"               # (kirocrew) command on PATH (~/.local/bin/<name>),
                                 # bundle bin/<name>[.cmd], console script; no
                                 # `kirocrew` is published. Hints say this name.
DATA_HOME="~/.devteam"           # (~/.kiro/crew) default data home; KIROCREW_HOME
                                 # still overrides. Must be under ~.
GATEWAY_PORT="5486"              # (5476) default dashboard/gateway port
DEFAULT_AGENT="claude"           # (kas) harness for a config with no
                                 # agent.acp_backend choice: kas | kiro | claude |
                                 # codex | opencode | pi | goose | deepseek | copilot | strands
URL_SCHEME="devteam"             # (kirocrew) desktop deep links: devteam://
SERVICE_NAME="devteam"           # (kirocrew) systemd unit; launchd label dev.<name>.gateway
DESKTOP_PACKAGE_NAME="devteam-desktop"  # (kirocrew-desktop) desktop app's data folder
                                 # (%APPDATA%\<name>) and Linux executable

# --- Visible text (scripts/rewrite_strings.py) -------------------------------
# Product name -> PRODUCT_NAME, `kirocrew <cmd>` hints -> CLI_NAME, and Kiro Crew's
# own GitHub / Discord links -> these. Kiro-service text and working service URLs
# are left alone (see scripts/rewrite_strings.py).
REPO_URL="https://github.com/sciencesoft-ai/devteam"         # issues, releases, home
SOURCE_REPO_URL="https://github.com/sciencesoft-ai/KiroCrew"  # source/doc links (blob/, tree/)

# --- Update / download hosts -------------------------------------------------
# TODO: replace with the real DevTeam CDN before the first release.
# The .invalid placeholders make auto-update fail closed instead of pulling
# stock KiroCrew builds from updates.crew.kiro.dev.
UPDATE_FEED_BASE="https://updates.devteam.invalid"
DOWNLOAD_BASE="https://download.devteam.invalid"

# --- Signing -----------------------------------------------------------------
# Must equal the CN of the Windows code-signing certificate (certs/devteam-codesign.cer):
# electron-updater on Windows rejects an update whose signer differs from this.
WIN_PUBLISHER_NAME="ScienceSoft AI DevTeam"
# NSIS install GUID for the side-by-side Nightly app (stable derives its GUID
# from APP_ID). Pinned forever once shipped: changing it orphans installs.
NIGHTLY_NSIS_GUID="dc50ee93-bded-58ce-ad14-c20d0c68c003"
# Linux package maintainer field (.deb/.rpm).
PACKAGE_MAINTAINER="DevTeam Maintainers <devteam@example.invalid>"  # TODO
